name: Build and Deploy FitTrack Stack (Feature)

on:
  push:
    branches:
      - feature/**

concurrency:
  group: fittrack-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate and Update Version
        id: versioning
        run: |
          # Extract current version from stack file (e.g., v2.2.0)
          CURRENT_VERSION=$(grep 'image: arjunvk/backend:' docker-stack.yaml | head -n 1 | awk -F':v' '{print $2}')
          
          # Split version into parts
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          
          # Increment Patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "Old Version: v$CURRENT_VERSION"
          echo "New Version: $NEW_VERSION"
          
          # Update the docker-stack.yaml file with the new version
          sed -i "s/arjunvk\/backend:v$CURRENT_VERSION/arjunvk\/backend:$NEW_VERSION/g" docker-stack.yaml
          sed -i "s/arjunvk\/frontend:v$CURRENT_VERSION/arjunvk\/frontend:$NEW_VERSION/g" docker-stack.yaml
          
          # Export for next steps
          echo "new_tag=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build Backend Image
        run: |
          docker build -t arjunvk/backend:${{ steps.versioning.outputs.new_tag }} ./backend

      - name: Build Frontend Image
        run: |
          docker build -t arjunvk/frontend:${{ steps.versioning.outputs.new_tag }} ./frontend

      - name: Remove Existing Stack
        run: |
          docker stack rm fittrack || true
          echo "Waiting for stack to be removed..."
          sleep 15

      - name: Deploy New Stack
        run: |
          # The docker-stack.yaml now contains the updated tags from the sed command above
          docker stack deploy -c docker-stack.yaml fittrack

      - name: Cleanup Unused Images
        run: |
          docker image prune -f
